[package]
name = "axum_template"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
rand = "0.10.2"
reqwest = "0.13.4"
rusqlite = "0.40.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
